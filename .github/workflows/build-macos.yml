name: Build macOS

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build universal macOS package
        run: npm run electron:mac -- --universal --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"

      - name: Upload macOS packages
        uses: actions/upload-artifact@v4
        with:
          name: MdEdit-macOS
          path: |
            release/*.dmg
            release/*.zip
          if-no-files-found: error
