name: Release Windows and macOS

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  build-windows:
    name: Build Windows packages
    runs-on: windows-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build Windows installer and portable app
        run: npm run electron:dist -- --x64 --publish never

      - name: Build unpacked Windows app
        run: npx electron-builder --win --x64 --dir --publish never

      - name: Archive unpacked Windows app
        shell: pwsh
        run: |
          $version = node -p "require('./package.json').version"
          Compress-Archive -LiteralPath release/win-unpacked -DestinationPath "release/MdEdit-Windows-Unpacked-$version-x64.zip"

      - name: Upload Windows packages
        uses: actions/upload-artifact@v7
        with:
          name: MdEdit-Windows
          path: |
            release/*.exe
            release/MdEdit-Windows-Unpacked-*.zip
          if-no-files-found: error

  build-macos:
    name: Build macOS packages
    runs-on: macos-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build universal macOS packages
        run: npm run electron:mac -- --universal --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"

      - name: Upload macOS packages
        uses: actions/upload-artifact@v7
        with:
          name: MdEdit-macOS
          path: |
            release/*.dmg
            release/*.zip
          if-no-files-found: error

  publish:
    name: Publish GitHub Release
    needs:
      - build-windows
      - build-macos
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download all packages
        uses: actions/download-artifact@v8
        with:
          pattern: MdEdit-*
          path: release
          merge-multiple: true

      - name: Create or update GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" release/* --clobber
          else
            gh release create "$RELEASE_TAG" release/* \
              --verify-tag \
              --title "MdEdit $RELEASE_TAG" \
              --generate-notes
          fi
